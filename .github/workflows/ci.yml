name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: iie
          POSTGRES_PASSWORD: iie
          POSTGRES_DB: iie_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U iie" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://iie:iie@127.0.0.1:5432/iie_test
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @iie/shared build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Migrations match the schema
        working-directory: apps/api
        run: npx drizzle-kit check
      - name: Dependency audit (production dependencies)
        run: pnpm audit --prod --audit-level high

  e2e:
    # The St. Lucia -> St. Vincent pilot flow in a real browser against the built apps.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: iie
          POSTGRES_PASSWORD: iie
          POSTGRES_DB: iie_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U iie" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      E2E_DATABASE_URL: postgres://iie:iie@127.0.0.1:5432/iie_e2e
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @iie/web exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  docker:
    # The staging images must keep building (no push; images are built on the server).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: API image
        uses: docker/build-push-action@v6
        with: { context: ., target: api, push: false, tags: "iie-api:ci" }
      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          push: false
          tags: iie-web:ci
          build-args: |
            API_ORIGIN=http://api:4000
            NEXT_PUBLIC_ENVIRONMENT_LABEL=Staging
      - name: Compose file is valid
        working-directory: deploy/staging
        run: cp .env.example .env && sed -i 's/^\([A-Z_]*\)=$/\1=ci-placeholder-value/' .env && docker compose config -q
