# IIE staging: one server in St. Vincent and the Grenadines.
#   cp .env.example .env   # fill in every value
#   docker compose up -d --build
# Only Caddy is reachable from outside (ports 80/443). The database, API and website stay on the private network.
name: iie-staging

x-api-env: &api-env
  APP_ENV: staging
  API_PORT: "4000"
  DATABASE_URL: postgres://iie:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/iie
  WEB_BASE_URL: https://${SITE_DOMAIN:?set SITE_DOMAIN}
  TRUST_PROXY: "true"
  COOKIE_SECURE: "true"
  MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?set MFA_ENCRYPTION_KEY}
  OUTBOX_IN_PROCESS: "false"
  EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
  EMAIL_FROM: ${EMAIL_FROM:?set EMAIL_FROM}
  SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
  SMTP_PORT: ${SMTP_PORT:-465}
  SMTP_SECURE: ${SMTP_SECURE:-true}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  STORAGE_PROVIDER: local
  MEDIA_LOCAL_DIR: /data/media
  PAYMENT_PROVIDER: sandbox
  SANDBOX_PAYMENT_SECRET: ${SANDBOX_PAYMENT_SECRET:?set SANDBOX_PAYMENT_SECRET}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: iie
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: iie
      TZ: America/St_Vincent
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iie -d iie"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot: applies database migrations and reference data (countries, lane, roles, placeholder rates), then exits.
  migrate:
    image: iie-api:staging
    build: { context: ../.., target: api }
    environment: *api-env
    command: ["sh", "-c", "node dist/db/migrate.js && node dist/db/seed.js"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    image: iie-api:staging
    restart: unless-stopped
    environment: *api-env
    volumes:
      - media:/data/media
    depends_on:
      migrate: { condition: service_completed_successfully }

  # Background jobs: emails, expiry of unpaid orders (30 min), automatic refunds after 48 h without seller confirmation.
  worker:
    image: iie-api:staging
    restart: unless-stopped
    environment: *api-env
    command: ["node", "dist/worker.js"]
    healthcheck: { disable: true }
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    image: iie-web:staging
    build:
      context: ../..
      target: web
      args:
        API_ORIGIN: http://api:4000
        NEXT_PUBLIC_ENVIRONMENT_LABEL: Staging
    restart: unless-stopped
    environment:
      API_ORIGIN: http://api:4000
    depends_on:
      api: { condition: service_healthy }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api

volumes:
  pgdata:
  media:
  caddy_data:
  caddy_config:
